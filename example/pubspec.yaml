name: layrz_ble_example
description: "Demonstrates how to use the layrz_ble plugin."
publish_to: 'none'

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: '>=3.47.0'

dependencies:
  flutter: { sdk: flutter }

  permission_handler: ^11.3.1
  flutter_material_design_icons: ^3.1.0+7447
  layrz_ui: ^1.3.0
  layrz_ui_extensions: ^1.2.0
  layrz_sdk: any
  layrz_ble:
    path: ../

dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
